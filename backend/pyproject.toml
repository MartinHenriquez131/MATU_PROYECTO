[project]
name = "matu-backend"
version = "0.1.0"
description = "MATU · Sistema de continuidad del cuidado · backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "detect-secrets>=1.5",
]
# Solo para regenerar la matriz de acceso (backend/db/gen_matriz.py)
diagramas = [
    "matplotlib>=3.8",
]

# Solo el paquete app/ se instala. alembic/, db/ y tests/ quedan fuera
[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# La carpeta alembic/ tiene el mismo nombre que la librería: se trata como de terceros
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["^alembic/versions/", "^\\.venv/", "^venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    'rf(requisito): requisito funcional que verifica la prueba, por ejemplo @pytest.mark.rf("RF-37")',
]
