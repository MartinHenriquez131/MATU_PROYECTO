version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: matu_postgres
    restart: always
    environment:
      POSTGRES_USER: matu_owner
      POSTGRES_PASSWORD: matu_password_local
      POSTGRES_DB: matu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: matu_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: