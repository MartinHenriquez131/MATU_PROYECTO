# MATU · Entorno local
# Desde la raíz del repositorio:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# Las contraseñas vienen del archivo .env (ver .env.example).

services:
  db:
    image: postgres:16-alpine
    container_name: matu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      MATU_OWNER_PASSWORD: ${MATU_OWNER_PASSWORD:?Falta MATU_OWNER_PASSWORD en .env}
      MATU_APP_PASSWORD: ${MATU_APP_PASSWORD:?Falta MATU_APP_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de arranque: crea roles y base la primera vez que se crea el volumen
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../backend/db:/matu-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d matu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: matu_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
