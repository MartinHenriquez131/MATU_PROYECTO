# MATU · Integración continua
# Corre en cada push y en cada pull request. Si un paso falla, el pipeline queda en rojo.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Contraseñas de una base desechable que solo existe durante el pipeline
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres_ci
      MATU_OWNER_PASSWORD: owner_ci
      MATU_APP_PASSWORD: app_ci
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://matu_owner:owner_ci@localhost:5432/matu
      DATABASE_URL: postgresql+psycopg://matu_app:app_ci@localhost:5432/matu
      MATU_TEST_DSN: host=localhost port=5432 user=postgres password=postgres_ci dbname=matu

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Estilo (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy .

      - name: Secretos (detect-secrets)
        working-directory: .
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Crear roles y base
        run: ROLES_SQL=db/00_roles.sql sh ../infra/postgres/init/10_matu.sh

      - name: Migraciones de subida y bajada
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Pruebas (pytest)
        run: pytest -q
