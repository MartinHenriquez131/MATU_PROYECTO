# MATU · Integración continua
# Corre en cada push y en cada pull request. Si un paso falla, el pipeline queda en rojo.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Redis 7, como infra/docker-compose.yml: sin él se saltan las pruebas del límite por IP
      # (MATU-25), la demora de intentos (MATU-38), las sesiones de relevo (MATU-19) y los códigos
      # (MATU-57). Sin contraseña, igual que el Redis local: solo existe durante el pipeline.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Contraseñas de una base desechable que solo existe durante el pipeline
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres_ci
      MATU_OWNER_PASSWORD: owner_ci
      MATU_APP_PASSWORD: app_ci
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://matu_owner:owner_ci@localhost:5432/matu
      DATABASE_URL: postgresql+psycopg://matu_app:app_ci@localhost:5432/matu
      # MATU-74 (H2): los roles de las tareas. 10_matu.sh les fija estas contraseñas, y con las dos URL
      # test_cada_tarea_se_conecta_con_su_rol no se salta
      MATU_SCHEDULER_PASSWORD: scheduler_ci
      MATU_PUBLISHER_PASSWORD: publisher_ci
      SCHEDULER_DATABASE_URL: postgresql+psycopg://matu_scheduler:scheduler_ci@localhost:5432/matu
      PUBLISHER_DATABASE_URL: postgresql+psycopg://matu_publisher:publisher_ci@localhost:5432/matu
      MATU_TEST_DSN: host=localhost port=5432 user=postgres password=postgres_ci dbname=matu
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Estilo (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy .

      - name: Secretos (detect-secrets)
        working-directory: .
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Crear roles y base
        run: ROLES_SQL=db/00_roles.sql sh ../infra/postgres/init/10_matu.sh

      - name: Migraciones de subida y bajada
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Pruebas (pytest)
        run: pytest -q

  # La app web (web/, ADR-026) corre en paralelo al backend. No tiene lint todavía: se revisan
  # los tipos, las pruebas de interfaz, que compile y que su contrato siga al openapi.json.
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # Node 22 (LTS): Vite 8 pide ^20.19.0 o >=22.12.0, y Node 20 ya no tiene soporte
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      # Estrategia de pruebas v1.2, fila «Interfaz web»: Vitest + Testing Library sobre jsdom
      - name: Pruebas de interfaz (vitest)
        run: npm test

      # web/dist no se sube como artefacto: solo se comprueba que compila
      - name: Compilar (vite build)
        run: npm run build

      # El #37 corrigió un familia.openapi.ts desfasado del contrato. Esto evita que se repita.
      - name: Contrato de la familia al día
        run: |
          npm run contrato:familia
          if ! git diff --exit-code -- src/compartido/api/familia.openapi.ts; then
            echo "::error file=web/src/compartido/api/familia.openapi.ts::El contrato de la app web no coincide con docs/api/openapi.json. Corre 'cd web && npm run contrato:familia' y sube el familia.openapi.ts regenerado."
            exit 1
          fi
