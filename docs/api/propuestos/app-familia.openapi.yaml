openapi: 3.1.0
info:
  title: MATU API · App de familia (propuesto)
  version: 0.1.0-propuesto
  summary: Sesión con refresh en cookie, dispositivos, autorización para el consumo, perfiles de consumo, qué se acaba pronto y alertas.
  description: |
    Contrato **propuesto** de MATU-32, acordado antes de implementar (arquitectura 15.5, regla 1).
    Lo implementan MATU-38 (sesión y dispositivos), MATU-36 (autorización para el consumo y
    perfiles), MATU-37 (qué se acaba pronto y alertas) y MATU-41 (avisos por push, que usa
    `PUT /v1/dispositivos/actual/push`). Lo consume la app de familia (MATU-39). Ver
    `docs/api/README.md`, sección "Lo que usa la app de familia (MATU-32)".

    **Estado de las decisiones.** Las decisiones de Martín del 31-10 y las de diseño de este
    contrato están **pendientes de aprobación de Jorge** (decisiones 37 a 54 del README).

    **Sesión (MATU-38, RF-37).**

    - El access token (JWT de 15 minutos, MATU-05a) vive **solo en memoria** en el cliente: nunca en
      `localStorage`, `sessionStorage`, IndexedDB, una cookie legible ni la URL. Al recargar la
      página, la app llama a `POST /v1/sesiones/renovar` y obtiene uno nuevo.
    - El refresh token viaja **solo** en la cookie `__Secure-matu-refresh` (`HttpOnly`, `Secure`,
      `SameSite=Strict`, `Path=/v1/sesiones`). Nunca en un cuerpo, una URL, un log, un error, la
      auditoría ni un evento. La base guarda solo su SHA-256 (`sesion_refresh.token_hash` e
      `indice_token.token_hash`, `tipo = 'refresh'`).
    - **Vigencia: 30 días desde el inicio de sesión, sin ventana deslizante** (decisión de Martín
      del 31-10). Iniciar sesión crea una familia (`familia_id`) con su `expira_en`, y cada token
      que nace al renovar hereda ese mismo `expira_en`. Renovar no alarga la sesión.
    - **Revocar no es inmediato para el access token.** Al cerrar sesión o sacar un dispositivo, el
      refresh deja de servir en ese momento, pero un access token ya emitido sigue valiendo hasta
      sus 15 minutos (arquitectura 11.6). Se acepta y se declara.

    **Contexto de la familia.** Las rutas de consumo y alertas usan `bearerAuth` + `X-Grupo-Id`
    (MATU-02) y fijan el contexto con `sesion_de_grupo`. Las de sesión y dispositivos no dependen de
    un grupo: no llevan `X-Grupo-Id`.

    **Lo que nunca sale ni se registra.** Los logs, los errores, la auditoría y los eventos del
    outbox nunca llevan `nombre_libre`, `push_token`, el refresh token, el access token, el email
    ni la IP. Un 422 nombra el campo y nunca repite el valor (`app/core/errores.py`). Los eventos
    del outbox llevan solo identificadores (`payload_solo_identificadores`).

    **`Cache-Control: no-store`** en toda respuesta de sesión, dispositivos, autorización, consumo
    y alertas. La cabecera `CacheControlNoStore` es la misma, idéntica, de `ficha.openapi.yaml` y
    `relevo.openapi.yaml`: su descripción habla de la ficha y del relevo, y aquí vale igual para
    lo que dice cuánto usa la persona de cada insumo o cómo entra la familia.

    **Ninguna ruta `/v1/relevo/…` devuelve consumo**, perfiles, alertas ni dispositivos.

    **Auditoría propuesta** (`auditoria.accion`, catálogo `AccionAuditoria`):
    `consentimiento.otorgar` (ya existe), `consumo.crear`, `consumo.editar`,
    `consumo.desactivar` y `alerta.descartar` (nuevas). Sin `nombre_libre`, sin cantidades y sin
    IP. Las lecturas del consumo no se auditan (decisión 52).
  contact:
    name: Equipo MATU
servers:
  - url: /
    description: Mismo origen que la aplicación web (sin CORS)
tags:
  - name: sesiones
    description: Entrar, renovar y salir (MATU-05a y MATU-38)
  - name: dispositivos
    description: Los navegadores con una sesión abierta y su endpoint de push (MATU-38 y MATU-41)
  - name: autorizaciones
    description: Autorización para el cálculo de insumos (MATU-36)
  - name: consumo
    description: Cuánto se usa de cada insumo y cuándo se acaba (capa 2, MATU-36 y MATU-37)
  - name: alertas
    description: Avisos antes de que algo se acabe (capa 2, MATU-37)

paths:
  /v1/sesiones:
    post:
      tags: [sesiones]
      operationId: iniciarSesion
      summary: Iniciar sesión (cambio propuesto a una ruta implementada)
      description: |
        **Ruta implementada** (MATU-05a, en `docs/api/openapi.json`). Este contrato propone un
        **cambio** que hace MATU-38, y MATU-38 **vuelve a exportar `openapi.json`** en el mismo PR.

        **Lo que no cambia:** el cuerpo (`SolicitudSesion`, sin largo mínimo ni forma de email) y la
        respuesta (`SesionRespuesta`: `access_token`, `token_type` y `expira_en` en **segundos**),
        el mismo 401 `credenciales-invalidas` exista o no el email, y `Cache-Control: no-store`.

        **Lo que agrega MATU-38:**

        1. **Cookie del refresh.** El 200 lleva `Set-Cookie: __Secure-matu-refresh=<refresh>` con
           `Max-Age=2592000` (30 días). El refresh son 256 bits aleatorios en base64url
           (43 caracteres). Crea una familia nueva (`familia_id`) con
           `expira_en = ahora + 30 días`, según el puerto `Reloj`.
        2. **Dispositivo.** Si la petición trae una cookie de refresh vigente **del mismo usuario** y
           su dispositivo no está revocado, reutiliza ese dispositivo y revoca la familia anterior
           (`motivo_revocacion = 'logout'`): un dispositivo tiene una sola sesión viva. Si no,
           crea un dispositivo con `plataforma = 'web'` y un `nombre` grueso que arma el servidor
           ("Chrome en Android", decisión 47), sin guardar el agente de usuario. En los dos casos
           fija `ultimo_uso_en`. Una cookie de otro usuario se ignora y se reemplaza.
        3. **El access token lleva el claim `did`** con el id del dispositivo, para que
           `GET /v1/dispositivos` sepa cuál es el `actual` (decisión 48).
        4. **Demora progresiva** (429), descrita abajo.

        **Orden de evaluación:**

        1. Cuerpo válido (topes de largo). Si no, **422**. No cuenta como intento.
        2. Demora progresiva: si la huella de la IP o la del email están en espera, **429** con
           `Retry-After`. No verifica la contraseña (no corre Argon2) y no cuenta como intento.
           Sin Redis, **503**: la entrada falla cerrada, igual que el canje del relevo (decisión 49).
        3. Credenciales. Si no corresponden, la cuenta no existe o no está activa, **401**
           `credenciales-invalidas`, y suma un fallo a las dos huellas.
        4. **200**: crea la familia, la cookie y el dispositivo, y borra el contador del email.

        **Demora progresiva** (decisión 49):

        - Dos contadores de fallos en Redis por petición fallida: uno por la huella de la IP y otro
          por la huella del email normalizado (la misma normalización de `indice_credencial`). Cada
          huella es `HMAC-SHA-256(PEPPER_LIMITES, "<prefijo>:<valor>")`, con un secreto nuevo de
          `.env` vía `pydantic-settings`, distinto de los demás. **Nunca la IP ni el email en
          claro**, ni en Redis ni en los logs. Cada contador vence a la hora del primer fallo.
        - **Los primeros intentos van sin demora:** hasta 5 fallos por email y 20 por IP en la hora
          (la IP es más permisiva porque en Chile muchos celulares comparten IP pública, CGNAT).
        - Desde ahí, la espera desde el último fallo crece: 30 s, 1, 2, 4 y 8 minutos, con un
          **tope de 15 minutos**. Mientras dura, la ruta responde 429 sin evaluar.
        - **El mismo trato exista o no el email.** El contador se lleva por la huella, sin leer la
          base, así que el 429 no revela si hay una cuenta.
        - **Nunca bloquea la cuenta:** no cambia `usuario.estado`. Pasada la espera, se puede
          volver a intentar. Un 200 borra el contador del email, nunca el de la IP.
      x-matu-historia: MATU-05a (implementada), MATU-38 (cambio), RF-37
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudSesion'
            examples:
              carmen:
                summary: Carmen entra con su email y su contraseña
                value:
                  email: carmen@ejemplo.cl
                  contrasena: '<contraseña de ejemplo>'
      responses:
        '200':
          description: |
            Sesión iniciada. El access token va en el cuerpo y el cliente lo guarda solo en memoria.
            El refresh va solo en la cookie.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefreshInicio'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionRespuesta'
              examples:
                iniciada:
                  summary: Access token de 15 minutos
                  value:
                    access_token: ejemplo.de-access-token.no-valido
                    token_type: bearer
                    expira_en: 900
        '401':
          $ref: '#/components/responses/CredencialesInvalidas'
        '422':
          $ref: '#/components/responses/ValidacionSesion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
        '503':
          $ref: '#/components/responses/SesionSinServicio'

  /v1/sesiones/renovar:
    post:
      tags: [sesiones]
      operationId: renovarSesion
      summary: Obtener un access token nuevo con la cookie del refresh
      description: |
        Sin `Authorization` y sin cuerpo. Usa la cookie `__Secure-matu-refresh` y la cabecera fija
        `X-MATU-Cliente: web`. La app la llama al abrir o recargar la página (el access token vive
        solo en memoria) y cuando una ruta responde 401 `token-invalido`.

        **Rotación con detección de reutilización** (arquitectura 11.6, `sesion_refresh`): cada
        refresh sirve **una vez**. Al renovar, el token presentado queda con `usado_en` y nace otro
        de la misma familia, con el mismo `expira_en`.

        **Orden de evaluación:**

        1. `X-MATU-Cliente: web`. Si falta o trae otro valor, **422**, antes de mirar la cookie: no
           toca la familia, no rota y no borra la cookie (decisión 45).
        2. Cookie presente y con forma de refresh. Si no, **401** `sesion-expirada`.
        3. El SHA-256 corresponde a una entrada de `indice_token` con `tipo = 'refresh'` (tabla sin
           RLS, que traduce el hash a `usuario_id` y al id de la sesión). Si no, **401**.
        4. Con `app.usuario_id` fijado, la sesión en `sesion_refresh` (`FOR UPDATE`):
           - revocada, vencida (`expira_en` igual o anterior al `Reloj`), de un dispositivo
             revocado, o de una cuenta que no está activa → **401**;
           - **ya usada** (`usado_en` no nulo) → **reutilización**: revoca toda la familia con
             `motivo_revocacion = 'reutilizacion'` en la misma transacción y responde **401**.
        5. Si no, **200**: marca `usado_en`, crea el token nuevo de la familia (y su entrada en
           `indice_token`), actualiza `dispositivo.ultimo_uso_en` y emite un access token.

        **Todos los 401 son el mismo** (`sesion-expirada`, mismo cuerpo, misma cookie borrada):
        sin cookie, desconocida, vencida, revocada o reutilizada son indistinguibles para el
        cliente. El servidor registra la reutilización como evento de seguridad en el log JSON,
        con el id de la familia y sin el token.

        **El access token** vence a los 15 minutos o cuando vence la familia, lo que ocurra
        primero: `expira_en` puede ser menor que 900 en el último cuarto de hora de la sesión.

        **Varias pestañas.** Dos renovaciones simultáneas con la misma cookie cuentan como
        reutilización y cierran la sesión. El cliente serializa la renovación entre pestañas (por
        ejemplo con `navigator.locks`) y nunca la reintenta con la cookie anterior (decisión 51).
      x-matu-historia: MATU-38, RF-37
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XMatuCliente'
      responses:
        '200':
          description: Access token nuevo, y una cookie nueva que reemplaza a la anterior.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefreshRenovado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionRespuesta'
              examples:
                renovada:
                  summary: Access token de 15 minutos
                  value:
                    access_token: ejemplo.de-access-token-renovado.no-valido
                    token_type: bearer
                    expira_en: 900
                ultimo_cuarto_de_hora:
                  summary: A la familia le quedan 4 minutos y 10 segundos
                  value:
                    access_token: ejemplo.de-access-token-final.no-valido
                    token_type: bearer
                    expira_en: 250
        '401':
          $ref: '#/components/responses/SesionExpirada'
        '422':
          $ref: '#/components/responses/FaltaCabeceraCliente'

  /v1/sesiones/cerrar:
    post:
      tags: [sesiones]
      operationId: cerrarSesion
      summary: Cerrar la sesión de este navegador
      description: |
        Sin cuerpo. Con la cookie `__Secure-matu-refresh` y `X-MATU-Cliente: web`. **No necesita el
        access token**: funciona aunque esté vencido o falte, y si viene, se ignora.

        - Si la cookie corresponde a una sesión, revoca **toda su familia**
          (`motivo_revocacion = 'logout'`) y, en la misma transacción, revoca el dispositivo
          (`revocado_en`) y pone su `push_token = NULL` (decisión 47): un navegador sin sesión no
          recibe avisos y deja de aparecer en `GET /v1/dispositivos`.
        - **Idempotente:** sin cookie, con una cookie desconocida, vencida o ya revocada, también
          responde 204. Siempre borra la cookie con `Max-Age=0`.
        - Un access token ya emitido sigue valiendo hasta sus 15 minutos. La app lo borra de la
          memoria al recibir el 204.

        Orden: `X-MATU-Cliente` (si falta, **422**, sin tocar nada) y después **204**.
      x-matu-historia: MATU-38, RF-37
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XMatuCliente'
      responses:
        '204':
          description: Sesión cerrada, o no había ninguna. Sin cuerpo.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Set-Cookie:
              $ref: '#/components/headers/BorrarCookieRefresh'
        '422':
          $ref: '#/components/responses/FaltaCabeceraCliente'

  /v1/dispositivos:
    get:
      tags: [dispositivos]
      operationId: listarDispositivos
      summary: Ver los dispositivos propios con una sesión abierta
      description: |
        Solo los dispositivos **del usuario del access token** que no están revocados. Sin
        `X-Grupo-Id`: no dependen de un grupo. RLS (`dispositivo_propio`) acota la consulta a
        `app.usuario_id`.

        Devuelve `id`, `plataforma`, `nombre`, `creado_en`, `ultimo_uso_en` y `actual`. **Nunca**
        devuelve `push_token` (ni si existe), `familia_id`, hashes, la IP ni el agente de usuario.
        `actual` es `true` para el dispositivo del claim `did` del access token; un access token
        anterior a MATU-38, sin `did`, deja todos en `false`.

        Orden: primero el actual y después por `ultimo_uso_en` descendente. Sin paginación: son
        pocos. Un dispositivo cuya sesión venció sin cerrarse sigue en la lista hasta que se saca
        (ver "Pendientes para Jorge" en el README).
      x-matu-historia: MATU-38
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Los dispositivos propios no revocados.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDispositivos'
              examples:
                dos:
                  summary: El teléfono de Carmen y el computador de su casa
                  value:
                    items:
                      - id: 6b2c3d40-0000-4000-8000-0000000000f1
                        plataforma: web
                        nombre: Chrome en Android
                        creado_en: '2026-10-20T22:14:00Z'
                        ultimo_uso_en: '2026-10-31T12:40:00Z'
                        actual: true
                      - id: 6b2c3d40-0000-4000-8000-0000000000f2
                        plataforma: web
                        nombre: Firefox en Windows
                        creado_en: '2026-10-12T01:05:00Z'
                        ultimo_uso_en: '2026-10-29T23:50:00Z'
                        actual: false
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /v1/dispositivos/{dispositivo_id}:
    parameters:
      - $ref: '#/components/parameters/DispositivoId'
    delete:
      tags: [dispositivos]
      operationId: sacarDispositivo
      summary: Sacar un dispositivo
      description: |
        En **una sola transacción**: revoca todas las sesiones del dispositivo
        (`sesion_refresh.revocado_en` con `motivo_revocacion = 'dispositivo'`), fija
        `dispositivo.revocado_en` y pone `push_token = NULL`. Desde ese momento su refresh no
        renueva y no recibe avisos. Su access token sigue valiendo hasta 15 minutos.

        - **`'dispositivo'` es un valor nuevo de `motivo_revocacion`.** El `CHECK` de
          `sesion_refresh` admite hoy `logout`, `reutilizacion`, `cambio_clave` y `operacion`: lo
          agrega una migración de Alembic reversible de MATU-38.
        - Un dispositivo de otro usuario, inexistente o con un id que no es UUID responde el mismo
          **404**.
        - Un dispositivo propio ya revocado responde **204** (idempotente).
        - Si es el **actual** (el `did` del access token), la respuesta además borra la cookie del
          refresh, y la app vuelve a la pantalla de entrada.
      x-matu-historia: MATU-38
      security:
        - bearerAuth: []
      responses:
        '204':
          description: |
            Dispositivo sacado. Sin cuerpo. `Set-Cookie` viene solo si era el actual.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Set-Cookie:
              $ref: '#/components/headers/BorrarCookieRefreshOpcional'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontradoPropio'

  /v1/dispositivos/actual/push:
    put:
      tags: [dispositivos]
      operationId: guardarPushDispositivo
      summary: Guardar el endpoint de push de este navegador
      description: |
        Guarda el endpoint de Web Push del dispositivo del claim `did` del access token, para los
        avisos de MATU-41. Reemplaza el anterior.

        - **El token solo se escribe.** Nunca aparece en una respuesta, un error, un log, la
          auditoría ni un evento del outbox. `GET /v1/dispositivos` no dice si existe.
        - Es un endpoint `https` de un servicio de push conocido, con un largo máximo (decisión 50).
          MATU le envía peticiones: aceptar cualquier URL le permitiría a un usuario hacer que el
          servidor llame a direcciones internas.
        - Sin `did` en el access token, o con el dispositivo revocado, **404**.

        Orden: 401, 404 (dispositivo actual), 422 y 204.
      x-matu-historia: MATU-38, MATU-41
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPush'
            examples:
              web_push:
                summary: Endpoint de un servicio de push del navegador (sintético)
                value:
                  push_token: https://fcm.googleapis.com/fcm/send/ejemplo-sintetico-no-valido
      responses:
        '204':
          description: Guardado. Sin cuerpo.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontradoPropio'
        '422':
          $ref: '#/components/responses/ValidacionPush'
    delete:
      tags: [dispositivos]
      operationId: borrarPushDispositivo
      summary: Dejar de recibir avisos en este navegador
      description: |
        Pone `push_token = NULL` en el dispositivo del claim `did`. Idempotente: sin token guardado
        también responde 204. Sin `did`, o con el dispositivo revocado, **404**.
      x-matu-historia: MATU-38, MATU-41
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sin endpoint de push. Sin cuerpo.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontradoPropio'

  /v1/personas-cuidadas/{persona_id}/consentimientos:
    parameters:
      - $ref: '#/components/parameters/PersonaId'
      - $ref: '#/components/parameters/XGrupoId'
    post:
      tags: [autorizaciones]
      operationId: otorgarAutorizacion
      summary: Dar la autorización para calcular cuándo se acaban los insumos
      description: |
        Registra un consentimiento con `finalidad = 'consumo'` para la persona (decisión 37, opción
        (a) del analista normativo, **pendiente de aprobación de Jorge**). La política de privacidad
        v0.9 ya lo anuncia: "Antes de activar el cálculo de insumos […] te pediremos una
        autorización". Sin ella, toda ruta de consumo responde 403.

        **Reutiliza exactamente el alta de MATU-07** (`care_circle/domain/personas.py`):

        - la misma `calidad_otorgante` (`titular`, `representante_legal`, `cuidador_de_hecho`) y las
          mismas reglas cruzadas de `validar_otorgamiento` para `aviso` y `referencia_documento`;
        - el mismo aviso del cuidador de hecho (`aviso_cuidador_de_hecho`, versión 1.0), que habla
          de "organizar su cuidado" y sirve igual;
        - la misma evidencia mínima (`consentimiento.evidencia`, migración 0006), con una
          **declaración nueva**: `{"id": "declaracion_consumo_<calidad>", "version": "<version_politica>"}`;
        - la misma revisión anual: `revision_vence_en` = 12 meses después para el cuidador de hecho;
        - la versión de la política la fija el servidor (`POLITICA_VERSION`), nunca el cliente.

        **Exige la política 0.10**, con la declaración nueva que el analista dejó como borrador.
        MATU-36 no habilita esta ruta mientras `POLITICA_VERSION` sea 0.9 (pendiente de Jorge).

        **Inalterable** (migración 0006): la fila nunca se edita ni se borra. Solo admite fijar
        `revocado_en` una vez. Hay un solo consentimiento no revocado por persona y finalidad
        (`consentimiento_vigente_uq`): si ya hay uno para `consumo`, **409**
        `/errores/autorizacion-vigente`, también cuando su revisión anual venció. Renovar la
        revisión y revocar quedan fuera de este contrato, con MATU-44.

        No depende del consentimiento para `plan_cuidado`: son autorizaciones separadas.

        Dan la autorización `admin` y `cuidador`, los mismos roles del alta (si no, 404). Registra
        `consentimiento.otorgar` sobre `consentimiento`, sin la referencia al documento.

        **Orden de evaluación:** 401, 404 (membresía, rol, persona), 422 (cuerpo y reglas de la
        calidad), 409 y 201.
