    get:
      tags: [consumo]
      operationId: verPerfilConsumo
      summary: Ver un insumo declarado
      description: |
        Un perfil de la persona, activo o desactivado, con su `ETag`. Leen los cuatro roles.

        **Orden de evaluación:** 401, 404 (membresía, persona), 403 (autorización para `consumo`),
        404 (el perfil no es de esta persona) y 200.
      x-matu-historia: MATU-36, RF-10, RF-11
      security:
        - bearerAuth: []
      responses:
        '200':
          description: El perfil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              $ref: '#/components/headers/ETagPerfil'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilConsumo'
              examples:
                panal:
                  $ref: '#/components/examples/PerfilPanal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinAutorizacionConsumo'
        '404':
