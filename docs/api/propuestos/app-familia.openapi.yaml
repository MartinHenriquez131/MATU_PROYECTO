    post:
      tags: [consumo]
      operationId: crearPerfilConsumo
      summary: Anotar cuánto se usa de un insumo y cuánto queda
      description: |
        Crea un perfil de consumo. El servidor fija `stock_medido_en` con el puerto `Reloj` (la
        fecha de hoy en America/Santiago, decisión 42) y calcula la fecha estimada:

        ```
        dias_cobertura         = piso(stock_unidades * tasa_dias / tasa_unidades)
        fecha_quiebre_estimada = stock_medido_en + dias_cobertura
        ```

        **`producto_id` o `nombre_libre`, exactamente uno** (el `CHECK` de la tabla admite los dos;
        la API exige uno). En el sprint 3 **no hay ruta de catálogo** (`GET /v1/catalogo/…` es de
        la capa 3, arquitectura 9.4) y la tabla `producto` puede estar vacía: **la app usa
        `nombre_libre`**. `producto_id` queda en el contrato para cuando exista el catálogo.

        - Un `producto_id` que no existe, inactivo o con `requiere_receta = true` responde **422**
          con `tipo: producto_no_admitido` (ADR-022: MATU no trata remedios). Los tres casos dan el
          mismo error.
        - Con `producto_id`, `unidad` es la del producto: si llega y es otra, **422**
          `tipo: unidad_distinta`.
        - Con `producto_id`, un perfil activo de la misma persona y el mismo producto responde
          **409** `/errores/perfil-duplicado` (`perfil_consumo_producto_uq`). Con `nombre_libre` no
          hay esa restricción.
        - `nombre_libre` se guarda **sin cifrar, protegido por RLS** (decisión 38). Nunca va en
          logs, errores, auditoría ni eventos.

        Escriben `admin` y `cuidador`. `pagador` y `observador` reciben **404** (decisión 4).
        Registra `consumo.crear` sobre `perfil_consumo`, sin `nombre_libre` ni cantidades.

        **Orden de evaluación:** 401, 404 (membresía, rol, persona), 403 (autorización para
        `consumo`), 422 (cuerpo, y después producto y unidad), 409 y 201.
      x-matu-historia: MATU-36, RF-10, RF-11
      x-matu-auditoria: consumo.crear
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPerfil'
            examples:
              panal:
                summary: Cuatro pañales al día y quedan 24
                value:
                  nombre_libre: Pañal adulto M
                  unidad: unidad
                  tasa_unidades: 4
                  tasa_dias: 1
                  stock_unidades: 24
                  dias_aviso: 7
              protector_cada_dos_dias:
                summary: Uno cada dos días, sin decir cuándo avisar (7 por omisión)
                value:
                  nombre_libre: Protector de cama desechable
                  tasa_unidades: 1
                  tasa_dias: 2
                  stock_unidades: 10
