              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              $ref: '#/components/headers/ETagPerfil'
            Location:
              description: Ruta del perfil creado.
              required: true
              schema:
                type: string
              example: /v1/personas-cuidadas/7d1e2f30-0000-4000-8000-000000000001/consumo/3c9d4e20-0000-4000-8000-0000000000c1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilConsumo'
              examples:
                panal:
                  $ref: '#/components/examples/PerfilPanal'
        '401':
