openapi: 3.1.0
info:
  title: MATU API · App de familia (propuesto)
  version: 0.4.0-propuesto
  summary: Sesión con refresh en cookie, dispositivos, autorización para el consumo, perfiles de consumo, qué se acaba pronto, alertas y la lista de insumos.
  description: |
    Contrato **propuesto** de MATU-32, acordado antes de implementar (arquitectura 15.5, regla 1).
    Lo implementan MATU-38 (sesión y dispositivos, ya en `openapi.json`), MATU-36 (autorización para el consumo y
    perfiles, ya en `openapi.json`), MATU-37 (qué se acaba pronto y alertas) y MATU-41 (avisos por push, que usa
    `PUT /v1/dispositivos/actual/push`). Lo consume la app de familia (MATU-39). Ver
    `docs/api/README.md`, sección "Lo que usa la app de familia (MATU-32)".

    **Estado de las decisiones.** Las decisiones de Martín del 31-10 y las de diseño de este
    contrato (37 a 54 del README) están **aprobadas por Jorge el 31-10**, salvo la sesión (decisión
    39), que Jorge cambió a una ventana deslizante. Sus decisiones son las 55 a 63 del README.

    **Sesión y dispositivos (MATU-38, RF-37): implementados.** `POST /v1/sesiones` (con el cambio de
    MATU-38), `POST /v1/sesiones/renovar`, `POST /v1/sesiones/cerrar`, `GET /v1/dispositivos`,
    `DELETE /v1/dispositivos/{dispositivo_id}` y `PUT`/`DELETE /v1/dispositivos/actual/push` pasaron a
    `docs/api/openapi.json` (exportado desde la API) y se quitaron de este archivo con sus componentes,
    como dice la regla de `docs/api/README.md`. Las decisiones que los explican (39, 40, 45, 47 a 51 y
    57) y las notas de implementación de MATU-38 siguen en el README.

    **Autorización y perfiles de consumo (MATU-36, RF-10 y RF-11): implementados.**
    `POST …/consentimientos`, `GET`/`POST …/consumo`, `GET`/`PATCH`/`DELETE …/consumo/{perfil_id}` y
    `POST …/consumo/{perfil_id}/desactivar` y `…/activar` pasaron a `docs/api/openapi.json` y se quitaron
    de este archivo con los componentes que solo ellos usaban. Las decisiones nuevas de Jorge del 03-11
    (68 a 73: reactivar, eliminar, conservación, lectura y escritura por rol, filtro `activo=todos` y
    quién guardó en el 412) están en el README.

    **Se acaban pronto y alertas (MATU-37, RF-12): implementados.** `GET …/consumo/por-acabarse`,
    `GET …/consumo/alertas`, `POST …/consumo/alertas/{alerta_id}/descartar` y la ruta nueva
    `POST …/consumo/{perfil_id}/resolver` («Ya lo resolví», decisión 76) pasaron a
    `docs/api/openapi.json` y se quitaron de este archivo con los componentes que solo ellas usaban
    (`AlertaId`, `ETag`, `UnidadConsumo`, `NombreLibre`, `ProductoResumen`, `PerfilConsumo`,
    `ListaPorAcabarse`, `EstadoAlerta`, `Alerta`, `ListaAlertas`, `NoAutenticadoApp`,
    `NoEncontradoApp`, `ValidacionConsultaApp`, `SinAutorizacionConsumo` y `AlertaCerrada`). Las
    decisiones 74 a 78 están en el README. MATU-37 dejó este archivo sin rutas, con las copias
    idénticas de los componentes de `relevo.openapi.yaml`.

    **Lista de insumos y unidades por envase (MATU-60, RF-15, ADR-031): implementados.** Se
    propusieron aquí el 06-11, Jorge los aprobó con tres ajustes y MATU-60 los implementó.
    `GET …/consumo/lista` (`ListaInsumos` y `LineaListaInsumos`) y `unidades_por_envase` en
    `SolicitudPerfil`, `SolicitudEdicionPerfil`, `PerfilConsumoVista` e `InsumoPorAcabarseVista`
    pasaron a `docs/api/openapi.json` y se quitaron de este archivo, con los fragmentos `Cambio*` y
    las respuestas que solo la lista usaba (`NoAutenticadoApp`, `NoEncontradoApp` y
    `SinAutorizacionConsumo`). Las decisiones 116 a 122 están en el README. El archivo vuelve a no
    tener rutas.

    **Retirar una autorización (MATU-44, RF-02 y RF-07): implementado.** Se propuso aquí el 06-11 y
    MATU-44 lo implementó. `POST …/consentimientos/{finalidad}/retiro`, `GET …/consentimientos` y
    `finalidad: plan_cuidado` en el `POST` pasaron a `docs/api/openapi.json` (`AutorizacionVista`,
    `AutorizacionesPersona`, `RetiroAutorizacion` y `EstadoVista`) y se quitaron de este archivo, con el
    parámetro `Finalidad`, el fragmento `CambioSolicitudAutorizacionEntrada` y la respuesta `YaRetirada`.
    Las decisiones 123 a 135 están en el README. El archivo vuelve a no tener rutas.

    **Contexto de la familia.** Las rutas de consumo y alertas usan `bearerAuth` + `X-Grupo-Id`
    (MATU-02) y fijan el contexto con `sesion_de_grupo`. Las de sesión y dispositivos no dependen de
    un grupo: no llevan `X-Grupo-Id`.

    **Lo que nunca sale ni se registra.** Los logs, los errores, la auditoría y los eventos del
    outbox nunca llevan `nombre_libre`, `push_token`, el refresh token, el access token, el email
    ni la IP. Un 422 nombra el campo y nunca repite el valor (`app/core/errores.py`). Los eventos
    del outbox llevan solo identificadores (`payload_solo_identificadores`).

    **`Cache-Control: no-store`** en toda respuesta de sesión, dispositivos, autorización, consumo
    y alertas. La cabecera `CacheControlNoStore` es la misma, idéntica, de `ficha.openapi.yaml` y
    `relevo.openapi.yaml`: su descripción habla de la ficha y del relevo, y aquí vale igual para
    lo que dice cuánto usa la persona de cada insumo o cómo entra la familia.

    **Ninguna ruta `/v1/relevo/…` devuelve consumo**, perfiles, alertas ni dispositivos.

    **Auditoría propuesta** (`auditoria.accion`, catálogo `AccionAuditoria`):
    `consentimiento.otorgar` (ya existe), `consumo.crear`, `consumo.editar`,
    `consumo.desactivar`, `consumo.activar` y `consumo.eliminar` (implementadas en MATU-36) y
    `alerta.descartar` (nueva, MATU-37). Sin `nombre_libre`, sin cantidades y sin
    IP. Las lecturas del consumo no se auditan (decisión 52).
  contact:
    name: Equipo MATU
servers:
  - url: /
    description: Mismo origen que la aplicación web (sin CORS)
tags:
  - name: autorizaciones
    description: Autorización para el cálculo de insumos (MATU-36)
  - name: consumo
    description: Cuánto se usa de cada insumo y cuándo se acaba (capa 2, MATU-36 y MATU-37)
  - name: alertas
    description: Avisos antes de que algo se acabe (capa 2, MATU-37)

paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de `POST /v1/sesiones`, de 15 minutos (MATU-05a).
  parameters:
    XGrupoId:
      name: X-Grupo-Id
      in: header
      required: false
      description: |
        Grupo familiar en el que actúa el usuario (MATU-02). **Se debe enviar siempre**, pero se
        declara `required: false` porque así la implementa `sesion_de_grupo`
        (`backend/app/modules/care_circle/api/dependencias.py`): su ausencia no la rechaza la
        validación (que respondería 422) sino la propia dependencia, con **404**. La API verifica en
        cada petición que el usuario es miembro activo. Si falta, no es un UUID o el usuario no es
        miembro, responde **404**, nunca 403 ni 422: no revela si el grupo existe.
      schema:
        type: string
        format: uuid
      example: 5a7c9e10-0000-4000-8000-0000000000a1
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Persona cuidada. Si no es un UUID o no es del grupo de `X-Grupo-Id`, responde **404**.
      schema:
        type: string
        format: uuid
      example: 7d1e2f30-0000-4000-8000-000000000001
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valor opaco de `siguiente_cursor` de la página anterior. Uno inválido responde 422.
      schema:
        type: string
        maxLength: 200
    Limite:
      name: limite
      in: query
      required: false
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    XRequestId:
      description: |
        Identificador de la petición (UUID). Es el mismo `request_id` de los logs y del cuerpo de un
        problema RFC 7807. Si el cliente envía un `X-Request-ID` que es un UUID, se reutiliza; si no,
        lo genera la API (`app/core/logs.py`). Va en **toda** respuesta, también las de error.
      required: true
      schema:
        type: string
        format: uuid
    CacheControlNoStore:
      description: |
        La respuesta lleva texto de la ficha, un PIN, un enlace de relevo, o quién recibió un acceso
        y cuándo lo usó, y no se guarda en ninguna caché (del navegador ni intermedia).
      required: true
      schema:
        type: string
        const: no-store
    WWWAuthenticateBearer:
      description: Esquema de autenticación esperado.
      required: true
      schema:
        type: string
        const: Bearer
  schemas:
    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, mensaje, tipo]
      description: Un error de validación. Nombra el campo, nunca repite el valor recibido.
      properties:
        campo:
          type: string
        mensaje:
          type: string
        tipo:
          type: string

    Problema:
      type: object
      required: [type, title, status, detail, errores, request_id]
      description: |
        Problema RFC 7807 (`application/problem+json`) tal como lo arma `app/core/errores.py`. Puede
        llevar miembros de extensión propios de cada error.
      properties:
        type:
          type: string
          format: uri-reference
          pattern: '^/errores/[a-z0-9-]+$'
        title:
          type: string
        status:
          type: integer
        detail:
          type: [string, 'null']
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'
        request_id:
          type: [string, 'null']
          format: uuid

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            type:
              const: /errores/validacion
            status:
              const: 422
            errores:
              minItems: 1

  responses:
    NoAutenticado:
      description: |
        Falta el access token (`/errores/no-autenticado`), o es inválido, alterado o vencido
        (`/errores/token-invalido`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticateBearer'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    enum: [/errores/no-autenticado, /errores/token-invalido]
                  status:
                    const: 401
          example:
            type: /errores/token-invalido
            title: No autenticado
            status: 401
            detail: Inicia sesión de nuevo
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e1

    SinConsentimiento:
      description: |
        La persona no tiene consentimiento vigente para `plan_cuidado` (arquitectura 11.1 y 11.5).
        Es la única causa de 403 en la ficha y en el relevo: un rol sin permiso recibe 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/sin-consentimiento
                  status:
                    const: 403
          example:
            type: /errores/sin-consentimiento
            title: Sin permiso
            status: 403
            detail: Falta la autorización para usar la ficha de esta persona
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e2

    NoEncontrado:
      description: |
        El mismo 404 para todos estos casos, para no revelar qué existe: falta `X-Grupo-Id` o no
        es un UUID; el usuario no es miembro activo del grupo; su rol no alcanza (`observador`;
        `pagador` sin `puede_ver_plan`; `pagador` que intenta compartir o revocar); la persona o el
        acceso no existen o son de otro grupo.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/no-encontrado
                  status:
                    const: 404
          example:
            type: /errores/no-encontrado
            title: No encontrado
            status: 404
            detail: null
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e3
