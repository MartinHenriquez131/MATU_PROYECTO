openapi: 3.1.0
info:
  title: MATU API · App de familia (propuesto)
  version: 0.1.0-propuesto
  summary: Sesión con refresh en cookie, dispositivos, autorización para el consumo, perfiles de consumo, qué se acaba pronto y alertas.
  description: |
    Contrato **propuesto** de MATU-32, acordado antes de implementar (arquitectura 15.5, regla 1).
    Lo implementan MATU-38 (sesión y dispositivos, ya en `openapi.json`), MATU-36 (autorización para el consumo y
    perfiles, ya en `openapi.json`), MATU-37 (qué se acaba pronto y alertas) y MATU-41 (avisos por push, que usa
    `PUT /v1/dispositivos/actual/push`). Lo consume la app de familia (MATU-39). Ver
    `docs/api/README.md`, sección "Lo que usa la app de familia (MATU-32)".

    **Estado de las decisiones.** Las decisiones de Martín del 31-10 y las de diseño de este
    contrato (37 a 54 del README) están **aprobadas por Jorge el 31-10**, salvo la sesión (decisión
    39), que Jorge cambió a una ventana deslizante. Sus decisiones son las 55 a 63 del README.

    **Sesión y dispositivos (MATU-38, RF-37): implementados.** `POST /v1/sesiones` (con el cambio de
    MATU-38), `POST /v1/sesiones/renovar`, `POST /v1/sesiones/cerrar`, `GET /v1/dispositivos`,
    `DELETE /v1/dispositivos/{dispositivo_id}` y `PUT`/`DELETE /v1/dispositivos/actual/push` pasaron a
    `docs/api/openapi.json` (exportado desde la API) y se quitaron de este archivo con sus componentes,
    como dice la regla de `docs/api/README.md`. Las decisiones que los explican (39, 40, 45, 47 a 51 y
    57) y las notas de implementación de MATU-38 siguen en el README.

    **Autorización y perfiles de consumo (MATU-36, RF-10 y RF-11): implementados.**
    `POST …/consentimientos`, `GET`/`POST …/consumo`, `GET`/`PATCH`/`DELETE …/consumo/{perfil_id}` y
    `POST …/consumo/{perfil_id}/desactivar` y `…/activar` pasaron a `docs/api/openapi.json` y se quitaron
    de este archivo con los componentes que solo ellos usaban. Las decisiones nuevas de Jorge del 03-11
    (68 a 73: reactivar, eliminar, conservación, lectura y escritura por rol, filtro `activo=todos` y
    quién guardó en el 412) están en el README.

    **Contexto de la familia.** Las rutas de consumo y alertas usan `bearerAuth` + `X-Grupo-Id`
    (MATU-02) y fijan el contexto con `sesion_de_grupo`. Las de sesión y dispositivos no dependen de
    un grupo: no llevan `X-Grupo-Id`.

    **Lo que nunca sale ni se registra.** Los logs, los errores, la auditoría y los eventos del
    outbox nunca llevan `nombre_libre`, `push_token`, el refresh token, el access token, el email
    ni la IP. Un 422 nombra el campo y nunca repite el valor (`app/core/errores.py`). Los eventos
    del outbox llevan solo identificadores (`payload_solo_identificadores`).

    **`Cache-Control: no-store`** en toda respuesta de sesión, dispositivos, autorización, consumo
    y alertas. La cabecera `CacheControlNoStore` es la misma, idéntica, de `ficha.openapi.yaml` y
    `relevo.openapi.yaml`: su descripción habla de la ficha y del relevo, y aquí vale igual para
    lo que dice cuánto usa la persona de cada insumo o cómo entra la familia.

    **Ninguna ruta `/v1/relevo/…` devuelve consumo**, perfiles, alertas ni dispositivos.

    **Auditoría propuesta** (`auditoria.accion`, catálogo `AccionAuditoria`):
    `consentimiento.otorgar` (ya existe), `consumo.crear`, `consumo.editar`,
    `consumo.desactivar`, `consumo.activar` y `consumo.eliminar` (implementadas en MATU-36) y
    `alerta.descartar` (nueva, MATU-37). Sin `nombre_libre`, sin cantidades y sin
    IP. Las lecturas del consumo no se auditan (decisión 52).
  contact:
    name: Equipo MATU
servers:
  - url: /
    description: Mismo origen que la aplicación web (sin CORS)
tags:
  - name: autorizaciones
    description: Autorización para el cálculo de insumos (MATU-36)
  - name: consumo
    description: Cuánto se usa de cada insumo y cuándo se acaba (capa 2, MATU-36 y MATU-37)
  - name: alertas
    description: Avisos antes de que algo se acabe (capa 2, MATU-37)

paths:
  /v1/personas-cuidadas/{persona_id}/consumo/por-acabarse:
    parameters:
      - $ref: '#/components/parameters/PersonaId'
      - $ref: '#/components/parameters/XGrupoId'
    get:
      tags: [consumo]
      operationId: listarPorAcabarse
      summary: Qué se acaba pronto
      description: |
        Los perfiles **activos** cuya fecha estimada está dentro de su ventana de aviso:
        `fecha_quiebre_estimada − hoy ≤ dias_aviso`, con hoy según el `Reloj` en America/Santiago.
        Incluye los que ya pasaron su fecha estimada (`dias_restantes` negativo). Ordenados por
        `fecha_quiebre_estimada` y después por `id`.

        Es una consulta sobre `perfil_consumo` (índice `perfil_consumo_quiebre_ix`), no sobre
        `alerta_quiebre`: muestra lo que se acaba aunque el trabajo diario todavía no haya creado
        la alerta, y no depende de que se haya descartado. Sin paginación: está acotada por los
        perfiles activos de una persona.

        La fecha es **una estimación** con lo que anotó la familia (política v0.9, sección 3). La
        pantalla usa los textos de `docs/lenguaje.md` (ver "Textos propuestos" en el README).

        Leen los cuatro roles. **Orden de evaluación:** 401, 404 (membresía, persona), 403
        (autorización para `consumo`) y 200.
      x-matu-historia: MATU-37, RF-11, RF-12
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lo que se acaba pronto.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPorAcabarse'
              examples:
                panal:
                  summary: Los pañales se acaban en 6 días y avisan con 7
                  value:
                    items:
                      - id: 3c9d4e20-0000-4000-8000-0000000000c1
                        producto: null
                        nombre_libre: Pañal adulto M
                        unidad: unidad
                        tasa_unidades: 4
                        tasa_dias: 1
                        stock_unidades: 24
                        stock_medido_en: '2026-10-31'
                        dias_aviso: 7
                        fecha_quiebre_estimada: '2026-11-06'
                        dias_restantes: 6
                        activo: true
                        etag: '"v1"'
        '401':
          $ref: '#/components/responses/NoAutenticadoApp'
        '403':
          $ref: '#/components/responses/SinAutorizacionConsumo'
        '404':
          $ref: '#/components/responses/NoEncontradoApp'

  /v1/personas-cuidadas/{persona_id}/consumo/alertas:
    parameters:
      - $ref: '#/components/parameters/PersonaId'
      - $ref: '#/components/parameters/XGrupoId'
    get:
      tags: [alertas]
      operationId: listarAlertasQuiebre
      summary: Ver las alertas de la persona
      description: |
        Las alertas (`alerta_quiebre`) de los perfiles de la persona, por `fecha_prevista` y
        después por `id`. Por omisión, las abiertas (`pendiente` y `notificada`). Paginado por
        cursor. Cada alerta trae `perfil_id`: el nombre del insumo sale del perfil, no se repite
        aquí.

        Las crea el trabajo diario de MATU-37 (arquitectura 8.5), una por perfil y fecha prevista
        (`alerta_quiebre_uq`), solo si la autorización para `consumo` está vigente.

        Leen los cuatro roles. **Orden de evaluación:** 401, 404 (membresía, persona), 403
        (autorización para `consumo`), 422 (consulta) y 200.
      x-matu-historia: MATU-37, RF-12
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: |
            Uno o más estados (`?estado=pendiente&estado=notificada`). Sin el parámetro, las abiertas
            (`pendiente` y `notificada`). Un valor fuera de la lista responde 422.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              $ref: '#/components/schemas/EstadoAlerta'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de alertas.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaAlertas'
              examples:
                una:
                  summary: Se avisó que los pañales se acaban el 06/11/2026
                  value:
                    items:
                      - id: 4f0a1b30-0000-4000-8000-0000000000d1
                        perfil_id: 3c9d4e20-0000-4000-8000-0000000000c1
                        fecha_prevista: '2026-11-06'
                        estado: notificada
                        creada_en: '2026-10-31T07:00:05Z'
                        notificada_en: '2026-10-31T07:00:40Z'
                        cerrada_en: null
                    siguiente_cursor: null
        '401':
          $ref: '#/components/responses/NoAutenticadoApp'
        '403':
          $ref: '#/components/responses/SinAutorizacionConsumo'
        '404':
          $ref: '#/components/responses/NoEncontradoApp'
        '422':
          $ref: '#/components/responses/ValidacionConsultaApp'

  /v1/personas-cuidadas/{persona_id}/consumo/alertas/{alerta_id}/descartar:
    parameters:
      - $ref: '#/components/parameters/PersonaId'
      - $ref: '#/components/parameters/AlertaId'
      - $ref: '#/components/parameters/XGrupoId'
    post:
      tags: [alertas]
      operationId: descartarAlertaQuiebre
      summary: No avisar esta vez
      description: |
        Pasa la alerta a `descartada` y fija `cerrada_en` con el `Reloj`. **Nunca la borra.** Sin
        cuerpo.

        - Solo desde `pendiente` o `notificada`. Desde `resuelta` o `descartada`, **409**
          `/errores/alerta-cerrada`, con el `estado` actual como miembro de extensión. Así un doble
          toque no cambia `cerrada_en`.
        - Descartar no cambia el perfil ni su fecha estimada: si la familia sigue sin anotar
          cuánto queda, el insumo sigue en "Qué se acaba pronto".
        - Descartan solo `admin` y `cuidador` (decisión de Jorge del 31-10). El `pagador` y el
          `observador` solo leen: reciben 404.
        - Registra `alerta.descartar` sobre `alerta_quiebre`, **sin `nombre_libre`**.

        "Ya lo compré" (`resuelta`) es declarar una reposición: es MATU-51, del sprint 4, y no está
        en este contrato.

        **Orden de evaluación:** 401, 404 (membresía, rol, persona), 403 (autorización para
        `consumo`), 404 (la alerta no es de un perfil de esta persona), 409 y 200.
      x-matu-historia: MATU-37, RF-12
      x-matu-auditoria: alerta.descartar
      security:
        - bearerAuth: []
      responses:
        '200':
          description: La alerta descartada.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'
              examples:
                descartada:
                  summary: Carmen eligió "No avisar esta vez"
                  value:
                    id: 4f0a1b30-0000-4000-8000-0000000000d1
                    perfil_id: 3c9d4e20-0000-4000-8000-0000000000c1
                    fecha_prevista: '2026-11-06'
                    estado: descartada
                    creada_en: '2026-10-31T07:00:05Z'
                    notificada_en: '2026-10-31T07:00:40Z'
                    cerrada_en: '2026-10-31T13:15:00Z'
        '401':
          $ref: '#/components/responses/NoAutenticadoApp'
        '403':
          $ref: '#/components/responses/SinAutorizacionConsumo'
        '404':
          $ref: '#/components/responses/NoEncontradoApp'
        '409':
          $ref: '#/components/responses/AlertaCerrada'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de `POST /v1/sesiones`, de 15 minutos (MATU-05a).
  parameters:
    XGrupoId:
      name: X-Grupo-Id
      in: header
      required: false
      description: |
        Grupo familiar en el que actúa el usuario (MATU-02). **Se debe enviar siempre**, pero se
        declara `required: false` porque así la implementa `sesion_de_grupo`
        (`backend/app/modules/care_circle/api/dependencias.py`): su ausencia no la rechaza la
        validación (que respondería 422) sino la propia dependencia, con **404**. La API verifica en
        cada petición que el usuario es miembro activo. Si falta, no es un UUID o el usuario no es
        miembro, responde **404**, nunca 403 ni 422: no revela si el grupo existe.
      schema:
        type: string
        format: uuid
      example: 5a7c9e10-0000-4000-8000-0000000000a1
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Persona cuidada. Si no es un UUID o no es del grupo de `X-Grupo-Id`, responde **404**.
      schema:
        type: string
        format: uuid
      example: 7d1e2f30-0000-4000-8000-000000000001
    AlertaId:
      name: alerta_id
      in: path
      required: true
      description: Alerta. Si no es un UUID, o no es de un perfil de la persona del path, responde **404**.
      schema:
        type: string
        format: uuid
      example: 4f0a1b30-0000-4000-8000-0000000000d1
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valor opaco de `siguiente_cursor` de la página anterior. Uno inválido responde 422.
      schema:
        type: string
        maxLength: 200
    Limite:
      name: limite
      in: query
      required: false
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    XRequestId:
      description: |
        Identificador de la petición (UUID). Es el mismo `request_id` de los logs y del cuerpo de un
        problema RFC 7807. Si el cliente envía un `X-Request-ID` que es un UUID, se reutiliza; si no,
        lo genera la API (`app/core/logs.py`). Va en **toda** respuesta, también las de error.
      required: true
      schema:
        type: string
        format: uuid
    CacheControlNoStore:
      description: |
        La respuesta lleva texto de la ficha, un PIN, un enlace de relevo, o quién recibió un acceso
        y cuándo lo usó, y no se guarda en ninguna caché (del navegador ni intermedia).
      required: true
      schema:
        type: string
        const: no-store
    WWWAuthenticateBearer:
      description: Esquema de autenticación esperado.
      required: true
      schema:
        type: string
        const: Bearer
  schemas:
    ETag:
      type: string
      pattern: '^"v[1-9][0-9]*"$'
      description: '`"v<version>"`, con las comillas, tal como va en la cabecera `ETag`.'
      examples:
        - '"v3"'

    UnidadConsumo:
      type: string
      enum: [unidad, sobre, ml, g]
      description: Unidad base de la tasa y del stock. Todo en unidades base, nunca en envases (arquitectura 7.3).

    NombreLibre:
      type: string
      minLength: 1
      maxLength: 60
      description: |
        **Nombre del producto tal como se vende. No es para remedios ni para explicar para qué se
        usa.**

        De 1 a 60 caracteres después de quitar los espacios de los extremos, una sola línea y sin
        caracteres de control. Se guarda sin cifrar, protegido por RLS (decisión 38). Los mensajes
        del 422 nunca repiten el valor. Nunca va en logs, errores, auditoría ni eventos.

    ProductoResumen:
      type: object
      additionalProperties: false
      required: [id, nombre, presentacion]
      description: Lo mínimo del producto del catálogo. Sin precio, sin marca y sin oferta.
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        presentacion:
          type: string
          description: Por ejemplo "Pañal adulto talla M x30".

    PerfilConsumo:
      type: object
      additionalProperties: false
      required: [id, producto, nombre_libre, unidad, tasa_unidades, tasa_dias, stock_unidades, stock_medido_en,
                 dias_aviso, fecha_quiebre_estimada, dias_restantes, activo, actualizado_por, etag]
      description: |
        Un perfil de consumo. Exactamente uno de `producto` y `nombre_libre` no es `null`. **Sin
        `grupo_id` y sin precios.** Es el mismo `PerfilConsumoVista` de `openapi.json` (MATU-36),
        donde ya está implementado; aquí lo usa "qué se acaba pronto" (MATU-37).
      properties:
        id:
          type: string
          format: uuid
        producto:
          oneOf:
            - $ref: '#/components/schemas/ProductoResumen'
            - type: 'null'
        nombre_libre:
          oneOf:
            - $ref: '#/components/schemas/NombreLibre'
            - type: 'null'
        unidad:
          $ref: '#/components/schemas/UnidadConsumo'
        tasa_unidades:
          type: integer
          minimum: 1
        tasa_dias:
          type: integer
          minimum: 1
          maximum: 90
        stock_unidades:
          type: integer
          minimum: 0
          description: Lo que quedaba en `stock_medido_en`, no lo que queda hoy.
        stock_medido_en:
          type: string
          format: date
          description: Fecha (America/Santiago) en que se anotó `stock_unidades`. La fija el servidor.
        dias_aviso:
          type: integer
          minimum: 0
          maximum: 60
        fecha_quiebre_estimada:
          type: string
          format: date
          readOnly: true
          description: |
            **Es una estimación** con lo que anotó la familia, no una promesa: no prevé un
            desabastecimiento ni un cambio de uso (arquitectura 7.3). Solo lectura:
            `stock_medido_en + piso(stock_unidades * tasa_dias / tasa_unidades)`, materializada al
            crear o editar.
        dias_restantes:
          type: integer
          readOnly: true
          description: |
            `fecha_quiebre_estimada − hoy`, con hoy según el `Reloj` en America/Santiago. 0 = se
            acaba hoy; negativo = la fecha estimada ya pasó y conviene anotar cuánto queda.
        activo:
          type: boolean
          description: '`false` = desactivado. Desactivar no borra; eliminar sí (decisión 69).'
        actualizado_por:
          description: Quién guardó la última vez, con su nombre de pila (decisión 73). `null` si la cuenta ya no está.
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, nombre]
              properties:
                id:
                  type: string
                  format: uuid
                nombre:
                  type: string
            - type: 'null'
        etag:
          $ref: '#/components/schemas/ETag'

    ListaPorAcabarse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PerfilConsumo'

    EstadoAlerta:
      type: string
      enum: [pendiente, notificada, resuelta, descartada]
      description: |
        `pendiente`: creada, sin avisar. `notificada`: ya se avisó. `resuelta`: se anotó una
        reposición (MATU-51, sprint 4). `descartada`: "No avisar esta vez", o el perfil se
        desactivó.

    Alerta:
      type: object
      additionalProperties: false
      required: [id, perfil_id, fecha_prevista, estado, creada_en, notificada_en, cerrada_en]
      properties:
        id:
          type: string
          format: uuid
        perfil_id:
          type: string
          format: uuid
        fecha_prevista:
          type: string
          format: date
          description: La fecha estimada del perfil cuando se creó la alerta.
        estado:
          $ref: '#/components/schemas/EstadoAlerta'
        creada_en:
          type: string
          format: date-time
        notificada_en:
          type: [string, 'null']
          format: date-time
        cerrada_en:
          type: [string, 'null']
          format: date-time

    ListaAlertas:
      type: object
      additionalProperties: false
      required: [items, siguiente_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        siguiente_cursor:
          type: [string, 'null']
          description: '`null` si no hay más.'

    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, mensaje, tipo]
      description: Un error de validación. Nombra el campo, nunca repite el valor recibido.
      properties:
        campo:
          type: string
        mensaje:
          type: string
        tipo:
          type: string

    Problema:
      type: object
      required: [type, title, status, detail, errores, request_id]
      description: |
        Problema RFC 7807 (`application/problem+json`) tal como lo arma `app/core/errores.py`. Puede
        llevar miembros de extensión propios de cada error.
      properties:
        type:
          type: string
          format: uri-reference
          pattern: '^/errores/[a-z0-9-]+$'
        title:
          type: string
        status:
          type: integer
        detail:
          type: [string, 'null']
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'
        request_id:
          type: [string, 'null']
          format: uuid

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            type:
              const: /errores/validacion
            status:
              const: 422
            errores:
              minItems: 1

  responses:
    NoAutenticado:
      description: |
        Falta el access token (`/errores/no-autenticado`), o es inválido, alterado o vencido
        (`/errores/token-invalido`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticateBearer'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    enum: [/errores/no-autenticado, /errores/token-invalido]
                  status:
                    const: 401
          example:
            type: /errores/token-invalido
            title: No autenticado
            status: 401
            detail: Inicia sesión de nuevo
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e1

    SinConsentimiento:
      description: |
        La persona no tiene consentimiento vigente para `plan_cuidado` (arquitectura 11.1 y 11.5).
        Es la única causa de 403 en la ficha y en el relevo: un rol sin permiso recibe 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/sin-consentimiento
                  status:
                    const: 403
          example:
            type: /errores/sin-consentimiento
            title: Sin permiso
            status: 403
            detail: Falta la autorización para usar la ficha de esta persona
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e2

    NoEncontrado:
      description: |
        El mismo 404 para todos estos casos, para no revelar qué existe: falta `X-Grupo-Id` o no
        es un UUID; el usuario no es miembro activo del grupo; su rol no alcanza (`observador`;
        `pagador` sin `puede_ver_plan`; `pagador` que intenta compartir o revocar); la persona o el
        acceso no existen o son de otro grupo.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/no-encontrado
                  status:
                    const: 404
          example:
            type: /errores/no-encontrado
            title: No encontrado
            status: 404
            detail: null
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e3

    NoAutenticadoApp:
      description: |
        El 401 de `NoAutenticado` (idéntico a `relevo.openapi.yaml`), más `Cache-Control: no-store`.
        Falta el access token (`/errores/no-autenticado`), o es inválido, alterado o vencido
        (`/errores/token-invalido`).

        **En la app de familia, `token-invalido` significa "renueva":** la app llama una vez a
        `POST /v1/sesiones/renovar` y repite la petición. Solo si la renovación responde 401
        `sesion-expirada` vuelve a la pantalla de entrada. El `detail` del ejemplo es el que
        devuelve hoy `usuario_actual` (MATU-05a); la app no lo muestra (`docs/lenguaje.md`,
        sección 8).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticateBearer'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    enum: [/errores/no-autenticado, /errores/token-invalido]
                  status:
                    const: 401
          example:
            type: /errores/token-invalido
            title: No autenticado
            status: 401
            detail: Inicia sesión de nuevo
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-000000000116

    NoEncontradoApp:
      description: |
        El mismo 404 para todos estos casos, para no revelar qué existe, con `Cache-Control:
        no-store`: falta `X-Grupo-Id` o no es un UUID; el usuario no es miembro activo del grupo; su
        rol no alcanza para escribir (`pagador` y `observador` al dar la autorización, crear,
        editar o desactivar un perfil, o descartar una alerta); la persona no existe o es de otro
        grupo; el perfil o la alerta no existen o no son de esa persona.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/no-encontrado
                  status:
                    const: 404
          example:
            type: /errores/no-encontrado
            title: No encontrado
            status: 404
            detail: null
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-000000000117

    ValidacionConsultaApp:
      description: '`cursor` inválido, `limite` fuera de 1 a 100, `activo` que no es booleano, o un `estado` fuera de la lista.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaValidacion'
          example:
            type: /errores/validacion
            title: Datos inválidos
            status: 422
            detail: Revisa los campos indicados
            errores:
              - campo: limite
                mensaje: Input should be less than or equal to 100
                tipo: less_than_equal
            request_id: 9b2f4c1e-0000-4000-8000-000000000118

    SinAutorizacionConsumo:
      description: |
        No hay una autorización vigente para `consumo` (decisión 37). Es la única causa de 403 en el
        consumo: un rol sin permiso recibe 404. Dos `type`, los mismos de la ficha, con el miembro
        de extensión **`finalidad: consumo`** para que la app sepa qué autorización falta:

        - `/errores/sin-consentimiento`: no hay consentimiento no revocado para `consumo`. La app
          muestra la pantalla para darla (`POST …/consentimientos`).
        - `/errores/revision-vencida`: lo dio un cuidador de hecho y su revisión anual
          (`revision_vence_en`) ya pasó, según el `Reloj` (decisión 33). La app muestra el aviso de
          `docs/lenguaje.md`, 6.4b.

        Se evalúa antes de leer el perfil o la alerta: sin autorización no se lee nada del consumo.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - type: object
                required: [finalidad]
                properties:
                  type:
                    enum: [/errores/sin-consentimiento, /errores/revision-vencida]
                  status:
                    const: 403
                  finalidad:
                    type: string
                    const: consumo
          examples:
            sinConsentimiento:
              summary: Falta la autorización para el consumo
              value:
                type: /errores/sin-consentimiento
                title: Sin permiso
                status: 403
                detail: Falta la autorización para calcular los insumos de esta persona
                errores: []
                request_id: 9b2f4c1e-0000-4000-8000-00000000010b
                finalidad: consumo
            revisionVencida:
              summary: Revisión anual del cuidador de hecho vencida
              value:
                type: /errores/revision-vencida
                title: Autorización por renovar
                status: 403
                detail: Venció la revisión anual de la autorización para calcular los insumos de esta persona
                errores: []
                request_id: 9b2f4c1e-0000-4000-8000-00000000010c
                finalidad: consumo

    AlertaCerrada:
      description: |
        `type` **nuevo** `/errores/alerta-cerrada`. La alerta ya está `resuelta` o `descartada` y
        no se puede descartar. Trae el `estado` actual como miembro de extensión.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - type: object
                required: [estado]
                properties:
                  type:
                    const: /errores/alerta-cerrada
                  status:
                    const: 409
                  estado:
                    type: string
                    enum: [resuelta, descartada]
          example:
            type: /errores/alerta-cerrada
            title: Conflicto
            status: 409
            detail: Este aviso ya estaba cerrado
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-000000000115
            estado: descartada

