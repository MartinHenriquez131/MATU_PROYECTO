  responses:
    NoAutenticadoCopia:
      description: |
        Falta el access token (`/errores/no-autenticado`), o es inválido, alterado o vencido
        (`/errores/token-invalido`). La app renueva una vez y repite. La pantalla nunca muestra el `detail`.
        No se cuenta en el límite ni se audita.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticateBearer'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    enum: [/errores/no-autenticado, /errores/token-invalido]
                  status:
                    const: 401

    NoEncontradoCopia:
      description: |
        Sin grupo válido, rol `pagador` u `observador`, persona de otro grupo, inexistente, eliminada o
        con sus datos borrados (C1, decisión 344). El mismo 404 en todos los casos. No se cuenta en el
        límite ni se audita. La pantalla de pagador y observador no ofrece el botón: dice «Los puede ver
        quien administra el grupo o quien cuida a {nombre_pila}.».
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/no-encontrado
                  status:
                    const: 404

    TopeCopias:
      description: |
        La cuenta ya pidió 10 copias en la ventana de una hora, sumando las dos rutas (D-54-10 a, C23,
        decisión 346). `type` propio para no confundirlo con el límite por IP. No se audita. La pantalla
        dice «Ya pediste los datos varias veces. Vuelve a intentarlo en una hora.».
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/tope-copias
                  status:
                    const: 429

    NoDisponibleCopia:
      description: |
        Sin Redis o sin `PEPPER_LIMITES` para el límite, o (solo en la copia de la persona) la custodia de
        la clave maestra no desenvolvió la clave de datos de una ficha vigente (decisión 32). No se entrega
        nada. Si el registro de la descarga ya se había escrito, se deshace con la transacción.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/servicio-no-disponible
                  status:
                    const: 503
