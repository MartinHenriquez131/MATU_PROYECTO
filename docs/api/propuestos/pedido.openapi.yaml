  responses:
    NoAutenticadoPedido:
      description: |
        Falta el access token (`/errores/no-autenticado`), o es inválido, alterado o vencido
        (`/errores/token-invalido`). La app renueva una vez y repite.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticateBearer'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    enum: [/errores/no-autenticado, /errores/token-invalido]
                  status:
                    const: 401

    NoEncontradoPedido:
      description: |
        El mismo 404 para todo, sin revelar qué existe: falta `X-Grupo-Id` o no es un UUID; no es miembro
        activo; su rol no alcanza (`pagador` u `observador` al escribir, `pagador` u `observador` en la
        dirección); la persona o el pedido no existen, son de otro grupo o la persona está eliminada; la
        persona no tiene pedido en curso (`GET …/pedido-en-curso`) o no tiene dirección que vaciar.
        «No encontramos este pedido.»
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/no-encontrado
                  status:
                    const: 404

    SinAutorizacionPedidos:
      description: Falta la autorización de pedidos, o venció su revisión (C21). Ver `ProblemaSinAutorizacionPedidos`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaSinAutorizacionPedidos'
          example:
            type: /errores/sin-autorizacion-pedidos
            title: Sin permiso
            status: 403
            detail: Falta la autorización para pedir insumos para esta persona
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000e4
            finalidad: despacho

    EstadoPedidoNoPermite:
      description: '`/errores/estado-pedido`: el estado del pedido no permite la acción.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaEstadoPedido'

    VersionPedido:
      description: Otra persona cambió el pedido desde que se leyó. `actual` trae el pedido vigente.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        ETag:
          $ref: '#/components/headers/ETagPedido'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaVersionPedido'

    PedidoActualizado:
      description: El pedido después del cambio, con su `etag` nuevo.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        ETag:
          $ref: '#/components/headers/ETagPedido'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoVista'

    ValidacionPedido:
      description: |
        Cuerpo, cabecera o regla inválidos. `errores[]` nombra el campo y nunca repite el valor. Tipos
        propios: `oferta_no_disponible`, `producto_repetido`, `producto_no_esta`, `telefono_requerido`,
        `celular_invalido`, `declaracion_no_vigente`. Y `/errores/idempotencia-reutilizada` (nuevo): la
        misma `Idempotency-Key` con otro cuerpo o de otra cuenta.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProblemaValidacion'
              - allOf:
                  - $ref: '#/components/schemas/Problema'
                  - properties:
                      type:
                        const: /errores/idempotencia-reutilizada
                      status:
                        const: 422

    FaltaVersion:
      description: '`/errores/falta-version`: falta `If-Match` (o `If-None-Match: *` en la dirección), o es `*`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/falta-version
                  status:
                    const: 428

    FaltaIdempotencia:
      description: '`/errores/falta-idempotencia` (nuevo): falta `Idempotency-Key`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - properties:
                  type:
                    const: /errores/falta-idempotencia
                  status:
                    const: 428

