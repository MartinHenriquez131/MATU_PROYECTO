            request_id: 9b2f4c1e-0000-4000-8000-0000000000ee

    SinSesionRelevo:
      description: |
        Falta la cookie de sesión de relevo, o no corresponde a ninguna sesión en Redis (alterada,
        o vencida por su propio TTL de 12 horas o el vencimiento del acceso). Revocar **no** lleva
        aquí: un acceso revocado con cookie válida responde 410. La página vuelve a pedir el PIN.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Referrer-Policy:
          $ref: '#/components/headers/ReferrerPolicy'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
      content:
