    RelevoBloqueado:
      description: |
        El acceso está bloqueado por 5 PIN incorrectos, o este intento fue el 5.º. No se
        desbloquea: la familia revoca y crea un acceso nuevo.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Referrer-Policy:
