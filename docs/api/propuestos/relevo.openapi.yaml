            status: 401
            detail: Abre de nuevo el enlace y escribe el PIN
            errores: []
            request_id: 9b2f4c1e-0000-4000-8000-0000000000ef

    DemasiadasPeticiones:
      description: |
        Se superó el límite de 10 peticiones por hora desde la misma IP (MATU-25). Canje y
        presentación comparten el contador, cuya clave es una huella de la IP (decisión 27). No
        toca el acceso ni cuenta como intento de PIN.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
